name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: timescale/timescaledb:2.16.1-pg16
        env:
          POSTGRES_USER: myoadapt
          POSTGRES_PASSWORD: myoadapt
          POSTGRES_DB: myoadapt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myoadapt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://myoadapt:myoadapt@localhost:5432/myoadapt_test
      AUTH_MODE: local
      AUTH_LOCAL_DEV_SECRET: ci-only-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.7.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Validate science seeds (E1.4)
        run: pnpm --filter @myoadapt/science validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Seed exercise & science data (live DB)
        run: pnpm --filter @myoadapt/science seed

  docker-images:
    name: Build service images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [identity-service, user-profile-service, engine-service, client]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build ${{ matrix.service }} image
        run: docker build -f apps/${{ matrix.service }}/Dockerfile -t myoadapt/${{ matrix.service }}:${{ github.sha }} .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
